name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Mikrofon/LM Studio/hoparlör gerektirmeyen birim testleri.
      # jarvis.py'deki ağır bağımlılıklar yumuşak import edilir; numpy yoksa
      # ses dönüşümü testleri otomatik atlanır.
      - name: Sözdizimi kontrolü
        run: python -m py_compile jarvis.py test_jarvis.py

      - name: Birim testleri
        run: python -m unittest -v test_jarvis.py
